services:
  # ═══════════════════════════════════════
  # БЭКЕНД (API)
  # ═══════════════════════════════════════
  - type: web
    name: cooperation-map-api
    env: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"

  # ═══════════════════════════════════════
  # ФРОНТЕНД (статика)
  # ═══════════════════════════════════════
  - type: web
    name: cooperation-map
    env: static
    plan: free
    region: frankfurt
    staticPublishPath: .                             # ← index.html в корне