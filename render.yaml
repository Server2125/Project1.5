services:
  # ═══ БЭКЕНД ═══
  - type: web
    name: cooperation-map-api
    env: python
    plan: free
    rootDir: backend                                    # ← main.py в backend/
    buildCommand: pip install -r requirements.txt       # ← ставит зависимости
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"

  # ═══ ФРОНТЕНД ═══
  - type: web
    name: cooperation-map
    env: static
    plan: free
    staticPublishPath: .                                # ← index.html в корне